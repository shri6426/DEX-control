<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DEX Control — Initial Setup</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-body">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo-badge">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                </svg>
            </div>
            <h1>DEX Control</h1>
            <p class="auth-subtitle">Windows Touch Control Deck for iPad</p>
        </div>

        <div class="setup-welcome">
            <p>Welcome! Before connecting your iPad, set a master password to protect your laptop control endpoints.</p>
        </div>

        <form id="setupForm" class="auth-form">
            <div class="form-group">
                <label for="password">Create Master Password</label>
                <input type="password" id="password" name="password" placeholder="At least 6 characters" required autocomplete="new-password" minlength="6">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm master password" required autocomplete="new-password">
            </div>

            <div id="setupError" class="auth-error-banner" style="display: none;"></div>

            <button type="submit" id="setupBtn" class="btn-primary btn-block">
                <span>Complete Setup & Launch</span>
            </button>
        </form>

        <div class="auth-footer-notice">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <span>Credentials are securely encrypted on your laptop using scrypt.</span>
        </div>
    </div>

    <script>
        const form = document.getElementById('setupForm');
        const errDiv = document.getElementById('setupError');
        const btn = document.getElementById('setupBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errDiv.style.display = 'none';
            
            const pwd = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;

            if (pwd.length < 6) {
                errDiv.textContent = 'Password must be at least 6 characters.';
                errDiv.style.display = 'block';
                return;
            }
            if (pwd !== confirm) {
                errDiv.textContent = 'Passwords do not match.';
                errDiv.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span>Setting up...</span>';

            try {
                const res = await fetch('/api/v1/auth/setup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pwd })
                });
                const data = await res.json();
                if (data.ok) {
                    window.location.href = '/';
                } else {
                    errDiv.textContent = data.message || 'Setup failed.';
                    errDiv.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = '<span>Complete Setup & Launch</span>';
                }
            } catch (err) {
                errDiv.textContent = 'Connection error. Please try again.';
                errDiv.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = '<span>Complete Setup & Launch</span>';
            }
        });
    </script>
</body>
</html>
